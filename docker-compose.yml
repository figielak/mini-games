services:
  games:
    image: ghcr.io/figielak/mini-games:latest
    restart: unless-stopped
    mem_limit: 256m

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    mem_limit: 64m
    depends_on: [games]
